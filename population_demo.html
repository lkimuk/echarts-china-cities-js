<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>北京各区2024年常住人口分布</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      .title {
        text-align: center;
        color: #333;
        margin-bottom: 10px;
      }
      .subtitle {
        text-align: center;
        color: #999;
        margin-bottom: 30px;
        font-size: 14px;
      }
      .toolbar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 12px;
      }
      .export-btn {
        border: 1px solid #3388b0;
        background: #fff;
        color: #3388b0;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .export-btn:hover {
        background: #3388b0;
        color: #fff;
      }
      .citymap {
        width: 100%;
        height: 700px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
    </style>
    <script src="./echarts.min.js"></script>
    <script src="./js/shape-with-internal-borders/zhi2_xia2_shi4_beijing.js"></script>
    <script src="./js/shape-only/zhi2_xia2_shi4_beijing.js"></script>
  </head>
  <body>
    <div class="container">
      <h1 class="title">📊 北京各区2024年常住人口分布（万人）</h1>
      <p class="subtitle">Distribution of Resident Population in 2024 (10000 persons)</p>
      <div class="toolbar">
        <button id="export-image" class="export-btn">导出高清图</button>
      </div>
      <div id="population-map" class="citymap"></div>
    </div>

    <script>
      // 北京各区2024年常住人口数据（万人）
      const populationData = [
        { name: '东城区', value: 70.1 },
        { name: '西城区', value: 109.5 },
        { name: '朝阳区', value: 343.9 },
        { name: '丰台区', value: 201.1 },
        { name: '石景山区', value: 56.1 },
        { name: '海淀区', value: 312.2 },
        { name: '门头沟区', value: 39.6 },
        { name: '房山区', value: 131.1 },
        { name: '通州区', value: 184.6 },
        { name: '顺义区', value: 132.6 },
        { name: '昌平区', value: 227.0 },
        { name: '大兴区', value: 199.5 },
        { name: '怀柔区', value: 43.9 },
        { name: '平谷区', value: 45.5 },
        { name: '密云区', value: 52.3 },
        { name: '延庆区', value: 34.2 }
      ];

      const hideValueLabelDistricts = new Set(['东城区', '西城区']);
      const outerBorderColor = '#3388b0';
      const districtLabelPositions = {
        东城区: [116.418757, 39.917544],
        西城区: [116.366794, 39.915309],
        朝阳区: [116.486409, 39.921489],
        丰台区: [116.286968, 39.863642],
        石景山区: [116.195445, 39.914601],
        海淀区: [116.310316, 39.956074],
        门头沟区: [116.105381, 39.937183],
        房山区: [116.139157, 39.735535],
        通州区: [116.658603, 39.902486],
        顺义区: [116.653525, 40.128936],
        昌平区: [116.235906, 40.218085],
        大兴区: [116.338033, 39.728908],
        怀柔区: [116.637122, 40.324272],
        平谷区: [117.112335, 40.144783],
        密云区: [116.843352, 40.377362],
        延庆区: [115.985006, 40.465325]
      };
      const districtLabelOffsets = {
        东城区: [18, -2],
        西城区: [-18, -2],
        朝阳区: [15, -10],
        丰台区: [0, 10],
        石景山区: [8, 8],
        海淀区: [-6, -18],
        门头沟区: [-84, -18],
        房山区: [-68, 10],
        通州区: [18, 48],
        顺义区: [8, 2],
        昌平区: [0, -10],
        大兴区: [18, 30],
        怀柔区: [-10, -28],
        平谷区: [10, -15],
        密云区: [28, -38],
        延庆区: [20, -2]
      };

      function polygonArea(ring) {
        if (!ring || ring.length < 3) {
          return 0;
        }

        let area = 0;
        for (let i = 0; i < ring.length; i++) {
          const current = ring[i];
          const next = ring[(i + 1) % ring.length];
          area += current[0] * next[1] - next[0] * current[1];
        }

        return Math.abs(area / 2);
      }

      function normalizeCoordinate(point) {
        return point.map(function (value) {
          return Number(value).toFixed(6);
        }).join(',');
      }

      function buildEdgeKey(start, end) {
        const startKey = normalizeCoordinate(start);
        const endKey = normalizeCoordinate(end);
        return startKey < endKey ? `${startKey}|${endKey}` : `${endKey}|${startKey}`;
      }

      function buildOuterBoundarySegments() {
        const districtMap = echarts.getMap('北京');
        if (!districtMap || !districtMap.geoJSON || !districtMap.geoJSON.features) {
          return [];
        }

        const edgeCounts = new Map();
        const edgePaths = new Map();

        function collectRingEdges(ring) {
          if (!ring || ring.length < 2) {
            return;
          }

          for (let i = 0; i < ring.length - 1; i++) {
            const start = ring[i];
            const end = ring[i + 1];
            const key = buildEdgeKey(start, end);
            edgeCounts.set(key, (edgeCounts.get(key) || 0) + 1);

            if (!edgePaths.has(key)) {
              edgePaths.set(key, [start, end]);
            }
          }
        }

        districtMap.geoJSON.features.forEach(function (feature) {
          const geometry = feature.geometry || {};

          if (geometry.type === 'Polygon') {
            geometry.coordinates.forEach(collectRingEdges);
          }

          if (geometry.type === 'MultiPolygon') {
            geometry.coordinates.forEach(function (polygon) {
              polygon.forEach(collectRingEdges);
            });
          }
        });

        return Array.from(edgeCounts.entries())
          .filter(function (entry) {
            return entry[1] === 1;
          })
          .map(function (entry) {
            return { coords: edgePaths.get(entry[0]) };
          });
      }

      function buildDistrictLabelData() {
        return populationData
          .map(function (item) {
            const position = districtLabelPositions[item.name];
            if (!position) {
              return null;
            }

            return {
              name: item.name,
              value: position,
              population: item.value
            };
          })
          .filter(Boolean);
      }

      function registerLargestOutlineMap() {
        const outlineMap = echarts.getMap('北京轮廓');
        if (!outlineMap || !outlineMap.geoJSON || !outlineMap.geoJSON.features) {
          return '北京轮廓';
        }

        let largestPolygon = null;
        let largestArea = 0;

        outlineMap.geoJSON.features.forEach(function (feature) {
          const geometry = feature.geometry || {};

          if (geometry.type === 'Polygon' && geometry.coordinates[0]) {
            const area = polygonArea(geometry.coordinates[0]);
            if (area > largestArea) {
              largestArea = area;
              largestPolygon = geometry.coordinates;
            }
          }

          if (geometry.type === 'MultiPolygon') {
            geometry.coordinates.forEach(function (polygon) {
              if (!polygon[0]) {
                return;
              }

              const area = polygonArea(polygon[0]);
              if (area > largestArea) {
                largestArea = area;
                largestPolygon = polygon;
              }
            });
          }
        });

        if (!largestPolygon) {
          return '北京轮廓';
        }

        echarts.registerMap('北京外框图层', {
          type: 'FeatureCollection',
          features: [
            {
              type: 'Feature',
              properties: { name: '北京' },
              geometry: {
                type: 'Polygon',
                coordinates: largestPolygon
              }
            }
          ]
        });

        return '北京外框图层';
      }

      const outlineMapName = registerLargestOutlineMap();
      const outerBoundarySegments = buildOuterBoundarySegments();
      const districtLabelData = buildDistrictLabelData();

      // 初始化图表
      const chart = echarts.init(document.getElementById('population-map'));

      const option = {
        tooltip: {
          trigger: 'item',
          formatter: function (params) {
            if (params.componentSubType === 'map') {
              const data = populationData.find(d => d.name === params.name);
              if (data) {
                return `${params.name}<br/>常住人口: ${data.value}万人`;
              }
              return params.name;
            }
            return params;
          }
        },
        visualMap: {
          show: false,
          seriesIndex: 1,
          type: 'piecewise',
          pieces: [
            { min: 200, color: '#f3a57c' },
            { min: 100, max: 199.9, color: '#f5d0a2' },
            { max: 99.9, color: '#b3ca9c' }
          ],
          realtime: true,
          calculable: false
        },
        geo: {
          map: '北京',
          roam: false,
          silent: true,
          itemStyle: {
            areaColor: 'rgba(0, 0, 0, 0)',
            borderColor: 'rgba(0, 0, 0, 0)'
          },
          emphasis: {
            itemStyle: {
              areaColor: 'rgba(0, 0, 0, 0)',
              borderColor: 'rgba(0, 0, 0, 0)'
            }
          },
          label: {
            show: false
          }
        },
        series: [
          {
            name: '外框底层',
            type: 'map',
            mapType: outlineMapName,
            roam: false,
            silent: true,
            z: 1,
            itemStyle: {
              normal: {
                areaColor: '#ffffff',
                borderColor: outerBorderColor,
                borderWidth: 2.5,
                shadowBlur: 24,
                shadowColor: 'rgba(0, 0, 0, 0.28)',
                shadowOffsetX: 8,
                shadowOffsetY: 10
              },
              emphasis: {
                areaColor: '#ffffff',
                borderColor: outerBorderColor,
                borderWidth: 2.5,
                shadowBlur: 24,
                shadowColor: 'rgba(0, 0, 0, 0.28)',
                shadowOffsetX: 8,
                shadowOffsetY: 10
              }
            },
            label: {
              show: false
            },
            data: [{ name: '北京', value: 1 }]
          },
          {
            name: '常住人口',
            type: 'map',
            mapType: '北京',
            roam: false,
            z: 2,
            itemStyle: {
              normal: {
                borderColor: '#fff',
                borderWidth: 0.5
              },
              emphasis: {
                shadowBlur: 10,
                shadowColor: 'rgba(0, 0, 0, 0.3)',
                borderColor: '#fff'
              }
            },
            label: {
              show: false
            },
            data: populationData
          },
          {
            name: '区名标签',
            type: 'custom',
            coordinateSystem: 'geo',
            silent: true,
            z: 2.2,
            renderItem: function (params, api) {
              const coord = api.coord([api.value(0), api.value(1)]);
              const name = api.value(2);
              const population = api.value(3);
              const offset = districtLabelOffsets[name] || [0, 0];
              const text = hideValueLabelDistricts.has(name) ? name : `${name}\n${population}万`;

              return {
                type: 'text',
                style: {
                  x: coord[0] + offset[0],
                  y: coord[1] + offset[1],
                  text: text,
                  fill: '#333',
                  fontSize: 9,
                  fontWeight: 'bold',
                  textAlign: 'center',
                  textVerticalAlign: 'middle',
                  lineHeight: 12
                },
                silent: true
              };
            },
            data: districtLabelData.map(function (item) {
              return [item.value[0], item.value[1], item.name, item.population];
            })
          },
          {
            name: '外框遮挡',
            type: 'custom',
            coordinateSystem: 'geo',
            silent: true,
            z: 2.5,
            renderItem: function (params, api) {
              const start = api.value(0);
              const end = api.value(1);
              const startPoint = api.coord(start);
              const endPoint = api.coord(end);

              return {
                type: 'line',
                shape: {
                  x1: startPoint[0],
                  y1: startPoint[1],
                  x2: endPoint[0],
                  y2: endPoint[1]
                },
                style: {
                  stroke: outerBorderColor,
                  lineWidth: 5,
                  lineCap: 'round',
                  lineJoin: 'round'
                },
                silent: true
              };
            },
            data: outerBoundarySegments.map(function (segment) {
              return [segment.coords[0], segment.coords[1]];
            })
          },
          {
            name: '外框描边',
            type: 'map',
            mapType: outlineMapName,
            roam: false,
            silent: true,
            z: 3,
            itemStyle: {
              normal: {
                areaColor: 'rgba(0, 0, 0, 0)',
                borderColor: outerBorderColor,
                borderWidth: 2.5
              },
              emphasis: {
                areaColor: 'rgba(0, 0, 0, 0)',
                borderColor: outerBorderColor,
                borderWidth: 2.5
              }
            },
            label: {
              show: false
            },
            data: [{ name: '北京', value: 1 }]
          }
        ]
      };

      chart.setOption(option);

      document.getElementById('export-image').addEventListener('click', function () {
        const url = chart.getDataURL({
          type: 'png',
          pixelRatio: 4,
          backgroundColor: '#ffffff',
          excludeComponents: ['toolbox']
        });

        const link = document.createElement('a');
        link.href = url;
        link.download = 'beijing-population-map-hd.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });

      // 响应式调整
      window.addEventListener('resize', function () {
        chart.resize();
      });
    </script>
  </body>
</html>
